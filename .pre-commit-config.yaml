repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
        # 归档的废弃代码不参与 lint（.trae_deleted 在根目录，也不在 backend/ruff.toml 配置管辖内）
        exclude: ^(\.trae_deleted/|backend/decision_py_archive_v2_202610/)
      - id: ruff-format
        files: ^backend/
        exclude: ^backend/decision_py_archive_v2_202610/

  # pytest 门禁：提交前跑 CI 同款测试（backtest / conformance / integration / db 列型门禁）
  # 避免本地 .so 缓存过期导致跑了假绿灯、推上去 CI 才炸
  - repo: local
    hooks:
      - id: pytest-backend
        name: pytest (backtest / conformance / integration / db)
        entry: bash -c 'cd backend && uv run pytest tests/unit/backtest tests/conformance tests/integration tests/unit/db -q'
        language: system
        pass_filenames: false
        always_run: true
        exclude: ^(\.trae_deleted/|backend/decision_py_archive_v2_202610/|\.github/)

      # banned 词条 lint 门禁（命名审计 P2-6）：消费 vocab.py 的 banned 词条事实源，
      # 基线只降不升（backend/scripts/vocab_lint.py 顶部注释有完整用法）
      - id: vocab-lint
        name: vocab banned-terms lint (vocab.py fact source)
        entry: bash -c 'cd backend && uv run python scripts/vocab_lint.py --check'
        language: system
        pass_filenames: false
        always_run: true
        exclude: ^(\.trae_deleted/|backend/decision_py_archive_v2_202610/|\.github/)

      # 前端门禁：改动 frontend/ 或词条 i18n/ 时跑 CI 同款 lint / tests / i18n audit
      # （build 含 tsc 全量类型检查且依赖 dist 产物，较重，留给 CI 把关）
      - id: frontend-lint
        name: frontend lint (eslint)
        entry: bash -c 'cd frontend && bun run lint'
        language: system
        pass_filenames: false
        files: ^(frontend/|i18n/)
      - id: frontend-tests
        name: frontend tests (vitest)
        entry: bash -c 'cd frontend && bun run test'
        language: system
        pass_filenames: false
        files: ^(frontend/|i18n/)
      - id: frontend-i18n-audit
        name: i18n hardcoded-Chinese audit
        entry: bash -c 'cd frontend && bun run i18n:audit -- --check'
        language: system
        pass_filenames: false
        files: ^(frontend/|i18n/)
