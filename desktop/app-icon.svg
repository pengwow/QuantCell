<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="qcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2c48"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="qcGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="qcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="qcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="qcBlur"/>
      <feMerge>
        <feMergeNode in="qcBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS 圆角底：824×824 居中，圆角 185（Big Sur 图标网格） -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#qcBg)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- logo 居中：viewBox 32 → 缩放 18.375，使图形（2..28）中心落在 512 -->
  <g transform="translate(236.375 236.375) scale(18.375)">
    <g filter="url(#qcShadow)">
      <path d="M 4 2 L 24 2 C 26 2, 26 4, 26 4 L 26 17 L 21 17 L 21 7 L 7 7 L 7 20.9
               L 17 20.9 L 17 26 L 4 26 C 2 26, 2 24, 2 24 L 2 4 C 2 2, 4 2, 4 2 Z"
            fill="#0ea5e9"/>
    </g>
    <rect x="19" y="19" width="9" height="9" rx="2.5" ry="2.5" fill="url(#qcGreen)"
          filter="url(#qcGlow)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.5"/>
    <rect x="11.2" y="11.2" width="5.6" height="5.6" rx="1.7" ry="1.7" fill="url(#qcGreen)"
          filter="url(#qcGlow)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.5"/>
    <g opacity="0.4">
      <rect x="20.5" y="20.5" width="3" height="3" rx="1" fill="white"/>
      <rect x="12.3" y="12.3" width="2.2" height="2.2" rx="0.6" fill="white"/>
    </g>
  </g>
</svg>
