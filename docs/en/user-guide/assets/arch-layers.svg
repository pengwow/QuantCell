<svg width="980" viewBox="0 0 980 1240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" style="max-width:100%;height:auto;background:#fff;border-radius:8px">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <style>
      .group-title { font-size:13px; font-weight:700; fill:#fff; letter-spacing:1px }
      .group-title-dark { font-size:13px; font-weight:700; fill:#333; letter-spacing:1px }
      .node { font-size:12px; font-weight:600; fill:#fff }
      .node-sm { font-size:11px; fill:#fff }
      .label { font-size:11px; fill:#555 }
      .sub { font-size:10px; fill:#fff; opacity:.85 }
      .pool-node { font-size:13px; font-weight:700; fill:#fff }
      .pool-sub { font-size:11px; fill:#fff; opacity:.85 }
      .kernel-title { font-size:15px; font-weight:800; fill:#fff }
      .kernel-sub { font-size:12px; fill:#fff; opacity:.9 }
          .hv:hover{filter:brightness(1.15);cursor:help}
    </style>
  </defs>

  
  <rect class="hv" x="40" y="20" width="900" height="70" rx="10" fill="#4f46e5"><title>Frontend: React 19 + Ant Design 6 + KLineCharts UI; packaged as desktop client via Tauri</title></rect>
  <text x="490" y="48" text-anchor="middle" class="group-title">Frontend</text>
  <text x="490" y="70" text-anchor="middle" class="node-sm">React 19 + Ant Design 6 + KLineCharts + Tauri desktop shell</text>

  
  <line x1="490" y1="90" x2="490" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="108" class="label">HTTP / WebSocket</text>

  
  <rect class="hv" x="40" y="120" width="900" height="70" rx="10" fill="#0891b2"><title>API layer: FastAPI entry (/api/v1) — routing &amp; DI, JWT/RBAC auth, unified error handling, Prometheus metrics</title></rect>
  <text x="490" y="148" text-anchor="middle" class="group-title">API Layer · FastAPI /api/v1</text>
  <text x="490" y="170" text-anchor="middle" class="node-sm">Routes · Depends DI · JWT / RBAC · Prometheus</text>

  
  <line x1="490" y1="190" x2="490" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  
  <rect class="hv" x="40" y="225" width="900" height="135" rx="10" fill="#059669"><title>Application service layer: business logic lives here; routes only parse params, services do the work</title></rect>
  <text x="490" y="252" text-anchor="middle" class="group-title">Application Service Layer</text>

  
  
  <rect class="hv" x="70" y="262" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>strategy/: strategy CRUD, templates, lifecycle routes, LLM decision recording &amp; replay</title></rect>
  <text x="165" y="280" text-anchor="middle" class="node-sm">strategy/ Strategy Mgmt</text>
  <text x="165" y="294" text-anchor="middle" class="sub">CRUD · templates · routes</text>

  <rect class="hv" x="280" y="262" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>backtest/service.py: backtest orchestration; picks kernel / legacy / python path via runner config</title></rect>
  <text x="375" y="280" text-anchor="middle" class="node-sm">backtest/service.py</text>
  <text x="375" y="294" text-anchor="middle" class="sub">Orchestration · 3 exec paths</text>

  <rect class="hv" x="490" y="262" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>worker/core_service.py: WorkerCoreService — create/delete/status/journal archive for live Workers</title></rect>
  <text x="585" y="280" text-anchor="middle" class="node-sm">worker/core_service.py</text>
  <text x="585" y="294" text-anchor="middle" class="sub">Live Worker CRUD · status</text>

  
  <rect class="hv" x="70" y="310" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>rl/service.py: RL training jobs (Gymnasium + Stable-Baselines3)</title></rect>
  <text x="165" y="328" text-anchor="middle" class="node-sm">rl/service.py RL Training</text>
  <text x="165" y="342" text-anchor="middle" class="sub">Stable-Baselines3 · parallel</text>

  <rect class="hv" x="280" y="310" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>backtest/hpo_trial.py: hyperparameter search; each trial runs in its own child process</title></rect>
  <text x="375" y="328" text-anchor="middle" class="node-sm">backtest/hpo_trial.py</text>
  <text x="375" y="342" text-anchor="middle" class="sub">HPO search · per-trial proc</text>

  <rect class="hv" x="490" y="310" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>factor/: factor mining, composition and factor backtesting</title></rect>
  <text x="585" y="328" text-anchor="middle" class="node-sm">factor/ Factor Analytics</text>
  <text x="585" y="342" text-anchor="middle" class="sub">Mining · composition · BT</text>

  
  <rect class="hv" x="175" y="358" width="190" height="35" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>agent/ + research/: AI Agent (memory &amp; tool calling) and research modules</title></rect>
  <text x="270" y="380" text-anchor="middle" class="node-sm">agent/ AI Agent + research/</text>

  <rect class="hv" x="400" y="358" width="190" height="35" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>credentials/: encrypted exchange API credential storage</title></rect>
  <text x="495" y="380" text-anchor="middle" class="node-sm">credentials/ exchange keys</text>

  <rect class="hv" x="625" y="358" width="220" height="35" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>collector/ realtime/ marketdata/: data collection, realtime distribution, history service</title></rect>
  <text x="735" y="380" text-anchor="middle" class="node-sm">collector/ realtime/ marketdata/</text>

  
  <line x1="375" y1="395" x2="220" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="395" x2="440" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="395" x2="440" y2="440" stroke="#555" stroke-width="1.5" opacity="0"/>
  <line x1="585" y1="395" x2="760" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  
  <rect class="hv" x="40" y="405" width="440" height="210" rx="12" fill="#fff8e1" stroke="#d97706" stroke-dasharray="6 3"><title>Group: CPU-heavy jobs (backtest / RL / HPO) concurrency area</title></rect>
  <text x="260" y="425" text-anchor="middle" class="group-title-dark" font-size="12px">▶ CPU jobs: backtest / RL / HPO</text>

  
  <rect class="hv" x="55" y="432" width="410" height="175" rx="8" fill="#d97706"><title>jobs/pool.py · BoundedJobPool: spawn + ProcessPoolExecutor job pool; 3-state toggle, core pinning, max_pending queue cap, BrokenProcessPool recovery</title></rect>
  <text x="260" y="455" text-anchor="middle" class="group-title">jobs/pool.py · BoundedJobPool</text>
  <text x="260" y="472" text-anchor="middle" class="sub">toggle · spawn ProcessPoolExecutor · core pinning</text>

  
  <rect class="hv" x="70" y="482" width="120" height="55" rx="6" fill="#b45309"><title>backtest job pool: bound to first half of CPU cores</title></rect>
  <text x="130" y="502" text-anchor="middle" class="pool-node">backtest pool</text>
  <text x="130" y="520" text-anchor="middle" class="pool-sub">BoundedJobPool</text>

  <rect class="hv" x="195" y="482" width="120" height="55" rx="6" fill="#b45309"><title>RL training pool</title></rect>
  <text x="255" y="502" text-anchor="middle" class="pool-node">RL training pool</text>
  <text x="255" y="520" text-anchor="middle" class="pool-sub">BoundedJobPool</text>

  <rect class="hv" x="320" y="482" width="120" height="55" rx="6" fill="#b45309"><title>HPO search pool: bound to second half of CPU cores</title></rect>
  <text x="380" y="502" text-anchor="middle" class="pool-node">HPO search pool</text>
  <text x="380" y="520" text-anchor="middle" class="pool-sub">BoundedJobPool</text>

  <rect class="hv" x="70" y="545" width="370" height="35" rx="6" fill="#92400e" opacity=".9"><title>Shared pool features: max_pending queue cap + BrokenProcessPool recovery</title></rect>
  <text x="255" y="567" text-anchor="middle" class="pool-sub">· max_pending queue cap · BrokenProcessPool recovery</text>

  
  <rect class="hv" x="500" y="405" width="440" height="210" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="6 3"><title>Group: long-running live strategy processes</title></rect>
  <text x="720" y="425" text-anchor="middle" class="group-title-dark" font-size="12px">▶ Live strategies (long-running)</text>

  <rect class="hv" x="515" y="432" width="410" height="175" rx="8" fill="#dc2626"><title>worker/orchestrator.py: ZMQ (5558/5559) orchestrator managing all live Worker processes</title></rect>
  <text x="720" y="455" text-anchor="middle" class="group-title">worker/orchestrator.py · ZMQ 5558/5559</text>
  <text x="720" y="472" text-anchor="middle" class="sub">worker/core_service.py · CRUD · journal archive · kill</text>

  <rect class="hv" x="530" y="482" width="120" height="55" rx="6" fill="#b91c1c"><title>One live Worker = one strategy + exchange + trading pair; independent long-running process</title></rect>
  <text x="590" y="502" text-anchor="middle" class="pool-node">Worker A</text>
  <text x="590" y="520" text-anchor="middle" class="pool-sub">strategy + exchange + pair</text>

  <rect class="hv" x="655" y="482" width="120" height="55" rx="6" fill="#b91c1c"><title>One live Worker = one strategy + exchange + trading pair; independent long-running process</title></rect>
  <text x="715" y="502" text-anchor="middle" class="pool-node">Worker B</text>
  <text x="715" y="520" text-anchor="middle" class="pool-sub">strategy + exchange + pair</text>

  <rect class="hv" x="780" y="482" width="120" height="55" rx="6" fill="#b91c1c"><title>...any number of Worker instances</title></rect>
  <text x="840" y="502" text-anchor="middle" class="pool-node">Worker N</text>
  <text x="840" y="520" text-anchor="middle" class="pool-sub">· · ·</text>

  <rect class="hv" x="530" y="545" width="370" height="35" rx="6" fill="#991b1b" opacity=".9"><title>Shared Worker features: DB + journal persistence, start/stop/restart/kill lifecycle</title></rect>
  <text x="715" y="567" text-anchor="middle" class="pool-sub">· DB persistence · start/stop/restart/kill · long-running</text>

  
  <line x1="260" y1="600" x2="260" y2="670" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="600" x2="720" y2="670" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="645" class="label" fill="#b45309">spawn child proc</text>

  
  <rect class="hv" x="40" y="675" width="900" height="115" rx="12" fill="#7c3aed"><title>axon-quant Rust core engine: axon-kernel 9-step per-bar orchestration (BarLifecycle); axon-worker provides PyKernel / BacktestRunner Python bindings; backtest/paper/live share one main loop</title></rect>
  <text x="490" y="700" text-anchor="middle" class="kernel-title">axon-quant · Rust core engine</text>
  <text x="490" y="722" text-anchor="middle" class="kernel-sub">axon-kernel: Kernel / BarLifecycle 9-step per-bar loop</text>
  <text x="490" y="740" text-anchor="middle" class="kernel-sub">axon-worker: PyKernel / BacktestRunner (Python bindings)</text>
  <text x="490" y="760" text-anchor="middle" class="kernel-sub">One main loop for all modes — backtest ↔ paper ↔ live parity</text>

  
  <line x1="490" y1="790" x2="490" y2="830" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  
  <rect class="hv" x="40" y="835" width="900" height="140" rx="10" fill="#64748b"><title>Storage &amp; infrastructure layer</title></rect>
  <text x="490" y="860" text-anchor="middle" class="group-title">Storage &amp; Infrastructure</text>

  <rect class="hv" x="60" y="870" width="160" height="90" rx="8" fill="#475569"><title>DuckDB 1.4: relational data (strategies, tasks, account metadata); SQLAlchemy 2 + Alembic migrations</title></rect>
  <text x="140" y="895" text-anchor="middle" class="node">DuckDB 1.4</text>
  <text x="140" y="915" text-anchor="middle" class="node-sm">Relational DB</text>
  <text x="140" y="935" text-anchor="middle" class="node-sm">SQLAlchemy · Alembic</text>

  <rect class="hv" x="240" y="870" width="160" height="90" rx="8" fill="#475569"><title>Parquet: columnar archive of klines / ticks / derivatives data</title></rect>
  <text x="320" y="895" text-anchor="middle" class="node">Parquet</text>
  <text x="320" y="915" text-anchor="middle" class="node-sm">market archive</text>
  <text x="320" y="935" text-anchor="middle" class="node-sm">Kline / Tick / Deriv</text>

  <rect class="hv" x="420" y="870" width="160" height="90" rx="8" fill="#475569"><title>Redis: cache &amp; realtime state, SSE pub/sub</title></rect>
  <text x="500" y="895" text-anchor="middle" class="node">Redis</text>
  <text x="500" y="915" text-anchor="middle" class="node-sm">Cache / state</text>
  <text x="500" y="935" text-anchor="middle" class="node-sm">SSE pub/sub</text>

  <rect class="hv" x="600" y="870" width="160" height="90" rx="8" fill="#475569"><title>Typer CLI: quantcell command line (jobs / worker / backtest / tests subcommands)</title></rect>
  <text x="680" y="895" text-anchor="middle" class="node">Typer CLI</text>
  <text x="680" y="915" text-anchor="middle" class="node-sm">quantcell CLI</text>
  <text x="680" y="935" text-anchor="middle" class="node-sm">jobs·worker·tests·backtest…</text>

  <rect class="hv" x="780" y="870" width="140" height="90" rx="8" fill="#475569"><title>Plugins: plugin foundation — event bus + sandbox isolation</title></rect>
  <text x="850" y="895" text-anchor="middle" class="node">Plugins</text>
  <text x="850" y="915" text-anchor="middle" class="node-sm">Event bus</text>
  <text x="850" y="935" text-anchor="middle" class="node-sm">Sandboxed</text>
</svg>