<svg width="980" viewBox="0 0 980 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" style="max-width:100%;height:auto;background:#fff;border-radius:8px">
  <defs>
    <marker id="d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .d-title { font-size:12px; font-weight:700; fill:#fff }
      .d-sub { font-size:10px; fill:#fff; opacity:.85 }
          .hv:hover{filter:brightness(1.15);cursor:help}
    </style>
  </defs>

  
  <rect class="hv" x="20" y="70" width="130" height="60" rx="10" fill="#64748b"><title>Exchange WebSocket: data source — raw klines / ticks / depth</title></rect>
  <text x="85" y="95" text-anchor="middle" class="d-title">Exchange WS</text>
  <text x="85" y="113" text-anchor="middle" class="d-sub">Kline · Tick · Depth</text>

  <path d="M155,100 L205,100" stroke="#333" stroke-width="1.5" marker-end="url(#d-arrow)"/>

  
  <rect class="hv" x="210" y="70" width="120" height="60" rx="10" fill="#0891b2"><title>realtime distribution: realtime market bus, fans out to consumers</title></rect>
  <text x="270" y="95" text-anchor="middle" class="d-title">realtime bus</text>
  <text x="270" y="113" text-anchor="middle" class="d-sub">realtime market bus</text>

  
  
  <path d="M335,90 L430,50 L490,50" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#d-arrow)"/>
  
  <path d="M335,110 L430,150 L490,150" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#d-arrow)"/>

  
  <rect class="hv" x="495" y="22" width="110" height="55" rx="8" fill="#059669"><title>Parquet persistence (persistence branch): columnar market archive</title></rect>
  <text x="550" y="44" text-anchor="middle" class="d-title">Parquet persist</text>
  <text x="550" y="60" text-anchor="middle" class="d-sub">market archive</text>

  
  <rect class="hv" x="495" y="122" width="110" height="55" rx="8" fill="#d97706"><title>paper/live pump (realtime branch): pumps live bars into the unified kernel (KernelPump)</title></rect>
  <text x="550" y="144" text-anchor="middle" class="d-title">paper/live pump</text>
  <text x="550" y="160" text-anchor="middle" class="d-sub">drives live strategies</text>

  
  <path d="M550,77 L550,95 L625,95 L625,125" stroke="#333" stroke-width="1.2" fill="none" marker-end="url(#d-arrow)"/>

  
  <rect class="hv" x="630" y="102" width="100" height="50" rx="8" fill="#047857"><title>quality: data quality checks &amp; repair</title></rect>
  <text x="680" y="122" text-anchor="middle" class="d-title">quality</text>
  <text x="680" y="138" text-anchor="middle" class="d-sub">QC · repair</text>

  
  <rect class="hv" x="630" y="30" width="100" height="50" rx="8" fill="#047857"><title>marketdata: historical market data query service</title></rect>
  <text x="680" y="50" text-anchor="middle" class="d-title">marketdata</text>
  <text x="680" y="66" text-anchor="middle" class="d-sub">history queries</text>

  
  <path d="M735,55 L785,55" stroke="#333" stroke-width="1.5" marker-end="url(#d-arrow)"/>
  <rect class="hv" x="790" y="30" width="100" height="50" rx="8" fill="#7c3aed"><title>Backtest engine: unified Kernel consumes history frames</title></rect>
  <text x="840" y="50" text-anchor="middle" class="d-title">Backtest engine</text>
  <text x="840" y="66" text-anchor="middle" class="d-sub">Unified Kernel</text>

  
  <path d="M605,150 L770,170 L840,170" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#d-arrow)"/>
  <path d="M840,80 L840,160" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#d-arrow)"/>

  
  <rect class="hv" x="850" y="140" width="120" height="50" rx="8" fill="#4f46e5"><title>Frontend snapshot: SSE / WebSocket push of live snapshots</title></rect>
  <text x="910" y="160" text-anchor="middle" class="d-title">Frontend snapshot</text>
  <text x="910" y="176" text-anchor="middle" class="d-sub">SSE / WebSocket push</text>

  
  <text x="270" y="60" font-size="11" fill="#555">input</text>
  <text x="400" y="35" font-size="10" fill="#555">persistence branch</text>
  <text x="400" y="180" font-size="10" fill="#555">realtime branch</text>
</svg>