<svg width="980" viewBox="0 0 980 1240" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" style="max-width:100%;height:auto;background:#fff;border-radius:8px">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <style>
      .group-title { font-size:13px; font-weight:700; fill:#fff; letter-spacing:1px }
      .group-title-dark { font-size:13px; font-weight:700; fill:#333; letter-spacing:1px }
      .node { font-size:12px; font-weight:600; fill:#fff }
      .node-sm { font-size:11px; fill:#fff }
      .label { font-size:11px; fill:#555 }
      .sub { font-size:10px; fill:#fff; opacity:.85 }
      .pool-node { font-size:13px; font-weight:700; fill:#fff }
      .pool-sub { font-size:11px; fill:#fff; opacity:.85 }
      .kernel-title { font-size:15px; font-weight:800; fill:#fff }
      .kernel-sub { font-size:12px; fill:#fff; opacity:.9 }
          .hv:hover{filter:brightness(1.15);cursor:help}
    </style>
  </defs>

  <!-- 前端层 -->
  <rect class="hv" x="40" y="20" width="900" height="70" rx="10" fill="#4f46e5"><title>前端层：React 19 + Ant Design 6 + KLineCharts 用户界面；Tauri 打包为桌面客户端</title></rect>
  <text x="490" y="48" text-anchor="middle" class="group-title">前 端</text>
  <text x="490" y="70" text-anchor="middle" class="node-sm">React 19 + Ant Design 6 + KLineCharts + Tauri 桌面壳</text>

  <!-- 箭头 前端→API -->
  <line x1="490" y1="90" x2="490" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="108" class="label">HTTP / WebSocket</text>

  <!-- API 层 -->
  <rect class="hv" x="40" y="120" width="900" height="70" rx="10" fill="#0891b2"><title>API 层：FastAPI 入口（/api/v1）——路由与依赖注入、JWT/RBAC 鉴权、统一异常处理、Prometheus 指标</title></rect>
  <text x="490" y="148" text-anchor="middle" class="group-title">API 层 · FastAPI /api/v1</text>
  <text x="490" y="170" text-anchor="middle" class="node-sm">路由层 · Depends 依赖注入 · JWT / RBAC · Prometheus</text>

  <!-- 箭头 API→应用服务 -->
  <line x1="490" y1="190" x2="490" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 应用服务层 -->
  <rect class="hv" x="40" y="225" width="900" height="135" rx="10" fill="#059669"><title>应用服务层：业务逻辑所在层；路由层只接参数，实际处理由各 service 完成</title></rect>
  <text x="490" y="252" text-anchor="middle" class="group-title">应 用 服 务 层</text>

  <!-- 9 个服务节点，3 行 x 3 列布局 -->
  <!-- 第一行 -->
  <rect class="hv" x="70" y="262" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>strategy/：策略 CRUD、模板、生命周期路由，LLM 决策录制与回放</title></rect>
  <text x="165" y="280" text-anchor="middle" class="node-sm">strategy/ 策略管理</text>
  <text x="165" y="294" text-anchor="middle" class="sub">策略 CRUD · 模板 · 路由</text>

  <rect class="hv" x="280" y="262" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>backtest/service.py：回测任务编排，按 runner 配置选择 kernel / legacy / python 三条执行路径</title></rect>
  <text x="375" y="280" text-anchor="middle" class="node-sm">backtest/service.py</text>
  <text x="375" y="294" text-anchor="middle" class="sub">回测编排 · 三条执行路径</text>

  <rect class="hv" x="490" y="262" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>worker/core_service.py：WorkerCoreService——实盘 Worker 的创建/删除/状态/journal 归档</title></rect>
  <text x="585" y="280" text-anchor="middle" class="node-sm">worker/core_service.py</text>
  <text x="585" y="294" text-anchor="middle" class="sub">Worker 实盘 CRUD · 状态</text>

  <!-- 第二行 -->
  <rect class="hv" x="70" y="310" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>rl/service.py：强化学习训练任务（Gymnasium + Stable-Baselines3）</title></rect>
  <text x="165" y="328" text-anchor="middle" class="node-sm">rl/service.py RL 训练</text>
  <text x="165" y="342" text-anchor="middle" class="sub">Stable-Baselines3 · 并行训练</text>

  <rect class="hv" x="280" y="310" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>backtest/hpo_trial.py：超参数搜索，每个试验在独立子进程中执行</title></rect>
  <text x="375" y="328" text-anchor="middle" class="node-sm">backtest/hpo_trial.py</text>
  <text x="375" y="342" text-anchor="middle" class="sub">HPO 搜索 · 多进程试验</text>

  <rect class="hv" x="490" y="310" width="190" height="40" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>factor/：因子挖掘、复合因子构建与因子回测</title></rect>
  <text x="585" y="328" text-anchor="middle" class="node-sm">factor/ 因子分析</text>
  <text x="585" y="342" text-anchor="middle" class="sub">因子挖掘 · 复合 · 回测</text>

  <!-- 第三行 -->
  <rect class="hv" x="175" y="358" width="190" height="35" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>agent/ + research/：AI Agent（记忆与工具调用）与研究模块</title></rect>
  <text x="270" y="380" text-anchor="middle" class="node-sm">agent/ AI Agent + research/</text>

  <rect class="hv" x="400" y="358" width="190" height="35" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>credentials/：交易所 API 凭证加密存储</title></rect>
  <text x="495" y="380" text-anchor="middle" class="node-sm">credentials/ 交易所凭证</text>

  <rect class="hv" x="625" y="358" width="220" height="35" rx="6" fill="#047857" stroke="#10b981" stroke-width="1"><title>collector/ realtime/ marketdata/：行情采集、实时分发、历史行情服务</title></rect>
  <text x="735" y="380" text-anchor="middle" class="node-sm">collector/ realtime/ marketdata/</text>

  <!-- 箭头 应用服务→调度层 -->
  <line x1="375" y1="395" x2="220" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="395" x2="440" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="395" x2="440" y2="440" stroke="#555" stroke-width="1.5" opacity="0"/>
  <line x1="585" y1="395" x2="760" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 中间分叉区标题 -->
  <rect class="hv" x="40" y="405" width="440" height="210" rx="12" fill="#fff8e1" stroke="#d97706" stroke-dasharray="6 3"><title>分组框：CPU 密集任务（回测 / RL / HPO）的并发调度区</title></rect>
  <text x="260" y="425" text-anchor="middle" class="group-title-dark" font-size="12px">▶ 回测 / RL 训练 / HPO 并发调度</text>

  <!-- Jobs 作业池 -->
  <rect class="hv" x="55" y="432" width="410" height="175" rx="8" fill="#d97706"><title>jobs/pool.py · BoundedJobPool：spawn + ProcessPoolExecutor 作业池；三态灰度开关、绑核切分、max_pending 排队上限、BrokenProcessPool 崩溃恢复</title></rect>
  <text x="260" y="455" text-anchor="middle" class="group-title">jobs/pool.py · BoundedJobPool</text>
  <text x="260" y="472" text-anchor="middle" class="sub">灰度开关 · spawn + ProcessPoolExecutor · 绑核切分</text>

  <!-- 三个池子 -->
  <rect class="hv" x="70" y="482" width="120" height="55" rx="6" fill="#b45309"><title>backtest 作业池：回测任务子池，绑定 CPU cores 前半段</title></rect>
  <text x="130" y="502" text-anchor="middle" class="pool-node">backtest 池</text>
  <text x="130" y="520" text-anchor="middle" class="pool-sub">BoundedJobPool</text>

  <rect class="hv" x="195" y="482" width="120" height="55" rx="6" fill="#b45309"><title>RL 训练池：强化学习训练子池</title></rect>
  <text x="255" y="502" text-anchor="middle" class="pool-node">RL 训练池</text>
  <text x="255" y="520" text-anchor="middle" class="pool-sub">BoundedJobPool</text>

  <rect class="hv" x="320" y="482" width="120" height="55" rx="6" fill="#b45309"><title>HPO 搜索池：超参搜索子池，绑定 CPU cores 后半段</title></rect>
  <text x="380" y="502" text-anchor="middle" class="pool-node">HPO 搜索池</text>
  <text x="380" y="520" text-anchor="middle" class="pool-sub">BoundedJobPool</text>

  <rect class="hv" x="70" y="545" width="370" height="35" rx="6" fill="#92400e" opacity=".9"><title>子池公共能力：max_pending 排队上限 + BrokenProcessPool 崩溃恢复</title></rect>
  <text x="255" y="567" text-anchor="middle" class="pool-sub">· max_pending 排队上限 · BrokenProcessPool 崩溃恢复</text>

  <!-- Worker 实盘进程 -->
  <rect class="hv" x="500" y="405" width="440" height="210" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="6 3"><title>分组框：策略任务运行区（后端进程内驱动线程）</title></rect>
  <text x="720" y="425" text-anchor="middle" class="group-title-dark" font-size="12px">▶ 策略任务（进程内驱动线程）</text>

  <rect class="hv" x="515" y="432" width="410" height="175" rx="8" fill="#dc2626"><title>worker/strategy_manager.py（worker_system 单例）：进程内直调，为每个策略任务驱动一条线程 + 一个 Rust Driver</title></rect>
  <text x="720" y="455" text-anchor="middle" class="group-title">worker/strategy_manager.py · 进程内直调</text>
  <text x="720" y="472" text-anchor="middle" class="sub">worker/core_service.py · Worker CRUD · journal 归档 · kill</text>

  <rect class="hv" x="530" y="482" width="120" height="55" rx="6" fill="#b91c1c"><title>每个运行中的 Worker = 后端进程内一条驱动线程 + 一个 Rust Driver 实例</title></rect>
  <text x="590" y="502" text-anchor="middle" class="pool-node">Worker A</text>
  <text x="590" y="520" text-anchor="middle" class="pool-sub">进程内驱动线程</text>

  <rect class="hv" x="655" y="482" width="120" height="55" rx="6" fill="#b91c1c"><title>每个运行中的 Worker = 后端进程内一条驱动线程 + 一个 Rust Driver 实例</title></rect>
  <text x="715" y="502" text-anchor="middle" class="pool-node">Worker B</text>
  <text x="715" y="520" text-anchor="middle" class="pool-sub">进程内驱动线程</text>

  <rect class="hv" x="780" y="482" width="120" height="55" rx="6" fill="#b91c1c"><title>……可扩展任意多个任务实例</title></rect>
  <text x="840" y="502" text-anchor="middle" class="pool-node">Worker N</text>
  <text x="840" y="520" text-anchor="middle" class="pool-sub">· · ·</text>

  <rect class="hv" x="530" y="545" width="370" height="35" rx="6" fill="#991b1b" opacity=".9"><title>Worker 公共能力：DB + journal 持久化，start/stop/restart/kill 生命周期管理（core_service 进程内直调）</title></rect>
  <text x="715" y="567" text-anchor="middle" class="pool-sub">· DB 持久化 · start/stop/restart/kill · 驱动线程</text>

  <!-- 箭头 调度层→内核 -->
  <line x1="260" y1="600" x2="260" y2="670" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="600" x2="720" y2="670" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="645" class="label" fill="#b45309">spawn 子进程</text>

  <!-- Rust 内核 -->
  <rect class="hv" x="40" y="675" width="900" height="115" rx="12" fill="#7c3aed"><title>axon-quant Rust 核心引擎：axon-kernel 九步 per-bar 编排（BarLifecycle）；axon-worker 提供 PyKernel / BacktestRunner Python 绑定；回测/paper/live 共用同一主回路</title></rect>
  <text x="490" y="700" text-anchor="middle" class="kernel-title">axon-quant · Rust 核心引擎</text>
  <text x="490" y="722" text-anchor="middle" class="kernel-sub">axon-kernel: Kernel / BarLifecycle 九步 per-bar 编排</text>
  <text x="490" y="740" text-anchor="middle" class="kernel-sub">axon-worker: PyKernel / BacktestRunner (Python 绑定)</text>
  <text x="490" y="760" text-anchor="middle" class="kernel-sub">三种模式共用同一主回路 — 回测 ↔ paper ↔ live 行为一致</text>

  <!-- 箭头 内核→存储 -->
  <line x1="490" y1="790" x2="490" y2="830" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 存储与基础设施 -->
  <rect class="hv" x="40" y="835" width="900" height="140" rx="10" fill="#64748b"><title>存储与基础设施层</title></rect>
  <text x="490" y="860" text-anchor="middle" class="group-title">存 储 与 基 础 设 施</text>

  <rect class="hv" x="60" y="870" width="160" height="90" rx="8" fill="#475569"><title>DuckDB 1.4：关系型数据（策略、任务、账户元数据），SQLAlchemy 2 + Alembic 迁移</title></rect>
  <text x="140" y="895" text-anchor="middle" class="node">DuckDB 1.4</text>
  <text x="140" y="915" text-anchor="middle" class="node-sm">关系型数据库</text>
  <text x="140" y="935" text-anchor="middle" class="node-sm">SQLAlchemy · Alembic</text>

  <rect class="hv" x="240" y="870" width="160" height="90" rx="8" fill="#475569"><title>Parquet：K 线 / Tick / 衍生品行情列式归档</title></rect>
  <text x="320" y="895" text-anchor="middle" class="node">Parquet</text>
  <text x="320" y="915" text-anchor="middle" class="node-sm">行情归档</text>
  <text x="320" y="935" text-anchor="middle" class="node-sm">K 线 / Tick / Deriv</text>

  <rect class="hv" x="420" y="870" width="160" height="90" rx="8" fill="#475569"><title>Redis：缓存与实时状态，SSE pub/sub</title></rect>
  <text x="500" y="895" text-anchor="middle" class="node">Redis</text>
  <text x="500" y="915" text-anchor="middle" class="node-sm">缓存 / 状态</text>
  <text x="500" y="935" text-anchor="middle" class="node-sm">SSE pub/sub</text>

  <rect class="hv" x="600" y="870" width="160" height="90" rx="8" fill="#475569"><title>Typer CLI：quantcell 命令行（jobs / worker / backtest / tests 等子命令）</title></rect>
  <text x="680" y="895" text-anchor="middle" class="node">Typer CLI</text>
  <text x="680" y="915" text-anchor="middle" class="node-sm">quantcell 命令</text>
  <text x="680" y="935" text-anchor="middle" class="node-sm">jobs·worker·tests·backtest…</text>

  <rect class="hv" x="780" y="870" width="140" height="90" rx="8" fill="#475569"><title>插件系统：插件基座——事件总线 + 沙箱隔离</title></rect>
  <text x="850" y="895" text-anchor="middle" class="node">插件系统</text>
  <text x="850" y="915" text-anchor="middle" class="node-sm">事件总线</text>
  <text x="850" y="935" text-anchor="middle" class="node-sm">沙箱隔离</text>
</svg>