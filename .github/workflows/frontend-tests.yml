name: Frontend Tests

# 前端门禁（对标 QuantDinger 的前端质量纪律，O4）：
# lint（eslint）→ test（vitest 纯函数回归）→ i18n 审计（O6）→ build（含 tsc -b 类型检查 + 生产构建）。
# build 同时充当 O5 的守护：生产产物由 terser drop_console 剥离 console/debugger。
#
# 触发路径限定 frontend/**，纯后端改动不跑（与 backend-tests.yml 互斥，省 runner 时长）。

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  # 阻断门禁：类型 + 纯函数回归 + 生产构建 + console 剥离验证
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: frontend
        run: bun run test

      # O6 门禁：硬编码中文基线只降不升（注释不计文案；迁出词条后 --update-baseline 收紧）
      - name: I18n hardcoded-Chinese audit
        working-directory: frontend
        run: bun run i18n:audit -- --check

      - name: Build (含 tsc -b 类型检查)
        working-directory: frontend
        run: bun run build

      # O5 验收口径：只查调用形（引用传递如 .catch(console.error) 是错误兜底，不拦）。
      # react-vendor 豁免：react-router 官方 production 包内嵌 devtools 提示字符串
      # （字符串里的 "console.log(" 文本，运行时不可达），其余 vendor 可达调用已被
      # terser drop_console 全部剥离
      - name: Verify no console in production bundle
        working-directory: frontend
        run: |
          if grep -rE 'console\.(log|debug|info|warn)\(' dist/assets/*.js --exclude='react-vendor-*.js'; then
            echo "::error::生产产物中检测到 console 调用，terser drop_console 配置失效"
            exit 1
          fi
          echo "生产产物 console 检查通过"

  # lint 门禁（滚动收紧）：当前存量 50 error（react-hooks v7 新规则 / 历史 no-explicit-any），
  # 一次性修绿属重构级风险，故先以非阻断红灯暴露，债务清零后去掉 continue-on-error 改回阻断。
  frontend-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: bun run lint
