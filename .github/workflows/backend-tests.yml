name: Backend Tests

# 后端 pytest（回测引擎 parity / 上游契约 / 集成 API）。
#
# 为什么需要 sibling checkout：QuantCell 通过本地 path 依赖拿引擎
# （backend/pyproject.toml 的 [tool.uv.sources] axon-quant = { path = "../../axon_quant" }），
# CI runner 上没有那个目录，所以这里把 axon_quant checkout 到 `<workspace>/axon_quant`，
# 与 `<workspace>/QuantCell/backend` 正好构成 ../../axon_quant 的相对关系。
#
# QuantCell 0.18.0 的共享资金池集成测试依赖 axon-quant 0.19.0 的 run_multi，
# 该特性尚未合入其 main（PR pengwow/axon_quant#65），故默认 ref 指向 0.19.0 分支。
# PR#65 合并后可切回 main。workflow_dispatch 仍可手动指定 ref。
# 注：inputs.axon_quant_ref 仅在 workflow_dispatch 事件下有值，push/PR 触发时走 fallback。

on:
  workflow_dispatch:
    inputs:
      axon_quant_ref:
        description: "axon_quant 仓库的 ref（默认 0.19.0）"
        required: false
        default: "0.19.0"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-tests:
    name: pytest (backtest / conformance / integration)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout QuantCell
        uses: actions/checkout@v4
        with:
          path: QuantCell

      - name: Checkout axon_quant（sibling，供 path 依赖构建）
        uses: actions/checkout@v4
        with:
          repository: pengwow/axon_quant
          ref: ${{ inputs.axon_quant_ref || '0.19.0' }}
          path: axon_quant

      # uv 会就地构建 axon-quant 扩展（其 pyproject 用 maturin），故需要 Rust 工具链
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: axon_quant

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14" # backend/.python-version 与 requires-python(>=3.14)

      - name: uv sync
        working-directory: QuantCell/backend
        run: uv sync

      # 全新 checkout 上没有 SQLite 库文件，涉及 DB 的用例（如 FactorService 读
      # factor_catalog、思维链接口读 thinking_chains）会报 "no such table"。
      # init_db.py 会 create_all + 跑迁移 + 补齐独立 Base 的两张表（见脚本注释）。
      - name: Init DB
        working-directory: QuantCell/backend
        run: uv run python init_db.py

      - name: pytest
        working-directory: QuantCell/backend
        run: uv run pytest tests/unit/backtest tests/conformance tests/integration -q
