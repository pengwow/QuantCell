name: desktop-build

on:
  workflow_dispatch:      # 手动触发，随时出包
  push:
    tags: ["v*"]          # 打版本 tag 时自动出三平台包

jobs:
  # 快检：每个 push 都跑（frontend build + vitest + cargo check）
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri build script needs pkg-config/webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            build-essential patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: Frontend build
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build

      - name: Frontend tests (vitest)
        run: |
          cd frontend
          bun run test

      - name: Rust check
        run: |
          cd desktop/src-tauri
          cargo check

  # 打包：手动 / tag 触发，矩阵多平台；每个 job 全链路（工具链→缓存→sidecar→tauri）
  build:
    needs: ci-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            triple: aarch64-apple-darwin
            artifact: macos-aarch64
          - os: macos-13          # Intel
            triple: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          # arm64 Linux 未来启用（runner: ubuntu-22.04-arm，triple: aarch64-unknown-linux-gnu）
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            build-essential patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv + Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # ---------- 缓存 ----------
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ matrix.triple }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.triple }}-

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ matrix.triple }}-${{ hashFiles('backend/uv.lock') }}

      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyinstaller
          key: pyinstaller-${{ matrix.triple }}-${{ hashFiles('backend/pyproject.toml') }}

      # sidecar 产物缓存：命中（依赖未变）直接复用，跳过 PyInstaller
      - name: Cache sidecar binary
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/binaries/quantcell-backend-*
          key: sidecar-${{ matrix.triple }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'desktop/scripts/build-backend.sh') }}

      # ---------- 构建 ----------
      - name: Build backend sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          cd backend
          uv sync --frozen --no-dev
          bash ../desktop/scripts/build-backend.sh "${{ matrix.triple }}"

      # uv 二进制是 Tauri bundle resource（resources/uv/ 被 gitignore），打包前现现下
      - name: Fetch uv binary
        run: bash desktop/scripts/fetch-uv.sh "${{ matrix.triple }}"

      - name: Build desktop app (Tauri)
        shell: bash
        env:
          # 私钥与密码来自仓库 Secrets；未配置时 tauri 会因缺少签名密钥直接失败
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd desktop
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "打包版本 $VERSION（来自 tag ${GITHUB_REF_NAME}）"
            # --config 内联 JSON 覆盖 tauri.conf.json 的 version，保证 tag 是版本唯一事实源
            bunx @tauri-apps/cli build --config "{\"version\":\"$VERSION\"}"
          else
            # 手动触发：沿用仓库里的 version（用于冒烟，不走发布）
            bunx @tauri-apps/cli build
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantcell-desktop-${{ matrix.artifact }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  # 发布：仅 tag 触发；四个平台产物 + updater manifest 一起发到 GitHub Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不 merge：保留下载目录名（= artifact name），聚合脚本按平台目录定位产物
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: quantcell-desktop-*

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Aggregate updater manifest
        env:
          MIRROR_BASE_URL: ${{ vars.UPDATE_MIRROR_BASE_URL }}
        run: |
          uv run --no-project --with typer python desktop/scripts/aggregate_updater_manifest.py \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "${GITHUB_REF_NAME}" \
            --input dist \
            --output dist/manifest \
            --notes "QuantCell ${GITHUB_REF_NAME}" \
            --mirror-base "$MIRROR_BASE_URL"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.app.tar.gz.sig
            dist/**/*-setup.exe
            dist/**/*-setup.exe.sig
            dist/**/*.msi
            dist/**/*.msi.sig
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.AppImage.tar.gz
            dist/**/*.AppImage.tar.gz.sig
            dist/manifest/latest.json
            dist/manifest/latest-mirror.json