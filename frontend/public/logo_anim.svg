<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 48 48" width="32" height="32">
  <defs>
    <linearGradient id="greenBlockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      /* 外圈：以小绿方块中心(14,14)旋转 */
      .rotate-wrap {
        transform-origin:14px 14px;
        animation: rotateAnim 2.5s ease-in-out infinite;
      }
      @keyframes rotateAnim {
        0% { transform: rotate(0deg); }
        20% { transform: rotate(360deg); }
        100% { transform: rotate(360deg); }
      }
      /* 小方块+高光同步呼吸 */
      .small-breath {
        transform-origin:14px 14px;
        animation: breathAnim 2.5s ease-in-out infinite;
      }
      @keyframes breathAnim {
        0% { transform: scale(0.75); }
        50% { transform: scale(1.3); }
        100% { transform: scale(0.75); }
      }
    </style>
  </defs>

  <!-- 整体平移：全部图形向右+向下偏移2px，把小方块中心14,14对齐画布中心16,16，解决左上偏移 -->
  <g transform="translate(2,2)">
    <!-- 旋转组：蓝色Q框、大绿方块、大高光 -->
    <g class="rotate-wrap">
      <g id="qLetterOutline" filter="url(#dropShadow)">
        <path d="M 4 2
L 24 2
C 26 2, 26 4, 26 4
L 26 17
L 21 17
L 21 7
L 7 7
L 7 20.9
L 17 20.9
L 17 26
L 4 26
C 2 26, 2 24, 2 24
L 2 4
C 2 2, 4 2, 4 2
Z" fill="#0ea5e9"/>
      </g>
      <g id="greenBlocks">
        <rect id="largeGreenBlock" x="19" y="19" width="9" height="9" rx="2.5" ry="2.5" fill="url(#greenBlockGradient)" filter="url(#greenGlow)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
      </g>
      <g id="highlights" opacity="0.4">
        <rect x="20.5" y="20.5" width="3" height="3" rx="1" fill="white"/>
      </g>
    </g>

    <!-- 独立呼吸组，不参与旋转 -->
    <g class="small-breath">
      <rect id="smallGreenBlock" x="11.2" y="11.2" width="5.6" height="5.6" rx="1.7" ry="1.7" fill="url(#greenBlockGradient)" filter="url(#greenGlow)" stroke="rgba(255,255,255,0.5)" stroke-width="0.5"/>
      <rect x="12.3" y="12.3" width="2.2" height="2.2" rx="0.6" fill="white" opacity="0.4"/>
    </g>
  </g>
</svg>