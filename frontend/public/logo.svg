<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="greenBlockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 整体平移，静态居中，无任何动画 -->
  <g transform="translate(2, 1.5)">
    <g id="qLetterOutline" filter="url(#dropShadow)">
      <path d="M 4 2
L 24 2
C 26 2, 26 4, 26 4
L 26 17
L 21 17
L 21 7
L 7 7
L 7 20.9
L 17 20.9
L 17 26
L 4 26
C 2 26, 2 24, 2 24
L 2 4
C 2 2, 4 2, 4 2
Z" fill="#0ea5e9"/>
    </g>
    <g id="greenBlocks">
      <rect id="largeGreenBlock" x="19" y="19" width="9" height="9" rx="2.5" ry="2.5" fill="url(#greenBlockGradient)" filter="url(#greenGlow)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
      <rect id="smallGreenBlock" x="11.2" y="11.2" width="5.6" height="5.6" rx="1.7" ry="1.7" fill="url(#greenBlockGradient)" filter="url(#greenGlow)" stroke="rgba(255,255,255,0.5)" stroke-width="0.5"/>
    </g>
    <g id="highlights" opacity="0.4">
      <rect x="20.5" y="20.5" width="3" height="3" rx="1" fill="white"/>
      <rect x="12.3" y="12.3" width="2.2" height="2.2" rx="0.6" fill="white"/>
    </g>
  </g>
</svg>