[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "aiosmtplib>=4.0.0",
    "aiohttp-socks>=0.11.0",
    "alembic>=1.17.2",
    "apscheduler>=3.11.1",
    "bcrypt>=5.0.0",
    "ccxt>=4.5.24",
    "certifi>=2025.11.12",
    "duckdb>=1.4.2",
    "duckdb-engine>=0.17.0",
    "fastapi-i18n>=0.12.0",
    "fastapi[standard]>=0.136.1",
    "joblib>=1.5.2",
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "passlib>=1.7.4",
    "plotly>=6.5.0",
    "polib>=1.2.0",
    "pydantic-settings>=2.9.0",
    "pyjwt>=2.10.1",
    "pysocks>=1.7.1",
    "python-multipart>=0.0.20",
    "python-socks>=2.8.0",
    "pytz>=2025.2",
    "pyzmq>=25.0",
    "setproctitle>=1.3.7",
    "sqlalchemy>=2.0.35",
    "statsmodels>=0.14.6",
    "tomli>=2.1.0",
    "tomli-w>=1.1.0",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
    "yfinance>=1.1.0",
    "python-binance>=1.0.34",
    "axon-quant>=0.11.1",
    "openai>=2.26.0",
    "toml>=0.10.2",
    "psutil>=7.1.3",
    "pyarrow>=22.0.0",
    "cryptography>=42.0.0",
    "gymnasium>=1.3.0",
    "stable-baselines3>=2.9.0",
    "socksio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
timeout = 30
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests as async",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
    "auth: marks tests as authentication tests",
    "schema: marks tests as schema validation tests",
    "error: marks tests as error handling tests",
    "timeout: marks tests with timeout",
    "benchmark: marks tests as performance benchmarks",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
# 从 backend 目录运行，用 . 覆盖全部业务代码（tests/.venv 已被 omit 排除）
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/venv/*",
    "*/.venv/*",
    # 测试夹具：故意放置的非法策略样例，非合法 Python 源码
    "*/strategies/InvalidStrategy.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
# 覆盖率基线（2026-09 首测 50.8%，collector/services 补测后 52%，data_service/deriv_service 补测后 53%，
# exchange/backtest/rl/quality/服务层/realtime 补测后 57%），作为防回归门槛，测试补充后逐步上调
fail_under = 57

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "coverage>=7.16.0",
    "dead>=2.1.0",
    "flake8>=7.3.0",
    "mypy>=1.18.2",
    "pre-commit>=4.0.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.3.0",
    "ruff>=0.12.12",
    "vulture>=2.16",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
    "I",   # isort
    "FURB", # flake8-raise-broken-exception
]
exclude = ["tests", "agent_workspace", "data", ".trash", "__pycache__"]
# 对需要过渡期的规则放宽，后续逐步收紧
# 注：PERF/SIM 已从 select 移除（此前 select 与 extend-ignore 重复配置等于永不生效）
extend-ignore = [
    "B904",   # raise without from - 逐步修复
    "E402",   # module import not at top - 存在合理的延迟导入
    "B008",   # function call in default arg - 逐步修复
    "RUF012", # mutable class default - 逐步修复
    "F821",   # undefined name - 动态导入误报
    "F401",   # unused import - 逐步修复
    "RUF006", # asyncio dangling task - 逐步修复
    "E722",   # bare except - 逐步修复
    "E501",   # line too long - 中文f-string换行限制，逐步修复
    "B023",   # function-uses-loop-variable - 逐步修复
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "RUF001", "RUF002", "RUF003", "E501"]
"tests/**/conftest.py" = ["F841", "B008"]
"**/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["tests", "data"]

[project.scripts]
quantcell = "cli.__main__:main"

# 项目自身作为包安装, uv 才会生成 `quantcell` 命令入口点(否则 project.scripts 会被跳过)
[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = [
    "agent_workspace*",
    "performance_reports*",
    "data*",
    "scripts*",
    "tests*",
    "docs*",
    "logs*",
    "htmlcov*",
    ".trash*",
    "frontend*",
]

