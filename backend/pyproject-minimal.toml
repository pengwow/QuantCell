[project]
name = "backend"
version = "0.1.0"
description = "QuantCell Backend - Minimal Version"
readme = "README.md"
requires-python = ">=3.12"

# 最小化核心依赖 - 仅包含运行系统必需的包
dependencies = [
    # ==================== Web 框架 ====================
    "fastapi[standard]==0.136.1",      # Web API 框架
    "uvicorn>=0.38.0",                 # ASGI 服务器
    
    # ==================== 数据库 ====================
    "sqlalchemy>=2.0.35",              # ORM 框架
    "alembic>=1.17.2",                 # 数据库迁移工具
    "duckdb>=1.4.2",                   # 分析型数据库
    "duckdb-engine>=0.17.0",           # DuckDB SQLAlchemy 引擎
    
    # ==================== 数据处理 ====================
    "pandas>=2.3.3",                   # 数据分析库
    "pyarrow>=22.0.0",                 # Apache Arrow (parquet 文件支持)
    
    # ==================== HTTP 客户端 ====================
    "aiohttp>=3.13.2",                 # 异步 HTTP 客户端
    "aiohttp-socks>=0.11.0",           # SOCKS 代理支持
    "aiosmtplib>=4.0.0",               # SMTP 邮件发送
    "certifi>=2025.11.12",             # SSL 证书验证
    "pysocks>=1.7.1",                  # SOCKS 代理
    "python-socks>=2.8.0",             # Socket 代理
    
    # ==================== 用户认证 ====================
    "bcrypt>=5.0.0",                   # 密码哈希
    "passlib>=1.7.4",                  # 密码管理
    "pyjwt>=2.10.1",                   # JWT 令牌
    
    # ==================== 配置与工具 ====================
    "loguru>=0.7.3",                   # 日志框架
    "typer>=0.20.0",                   # CLI 工具
    "psutil>=7.1.3",                   # 系统监控
    "pytz>=2025.2",                    # 时区处理
    "tomli>=2.1.0",                    # TOML 解析 (Python 3.11+)
    "tomli-w>=1.1.0",                  # TOML 写入
    "toml>=0.10.2",                    # TOML 解析 (兼容旧版本)
    "setproctitle>=1.3.7",             # 进程标题设置
    "tqdm>=4.67.1",                    # 进度条
    "python-multipart>=0.0.20",        # 表单数据解析
    
    # ==================== AI 与策略 ====================
    "openai>=2.26.0",                  # OpenAI API 客户端
    
    # ==================== 交易所 (精简) ====================
    "ccxt>=4.5.24",                    # 统一交易所 API
    
    # ==================== 调度与通知 ====================
    "apscheduler>=3.11.1",             # 任务调度
    "fastapi-i18n>=0.12.0",            # 国际化支持
    "polib>=1.2.0",                    # PO 文件处理
    
    # ==================== 可视化 (可选) ====================
    "plotly>=6.5.0",                   # 交互式图表
    
    # ==================== 网络 ====================
    "pyzmq>=27.1.0",                   # ZeroMQ (实时数据传输)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
timeout = 30
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests as async",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
    "auth: marks tests as authentication tests",
    "schema: marks tests as schema validation tests",
    "error: marks tests as error handling tests",
    "timeout: marks tests with timeout",
    "benchmark: marks tests as performance benchmarks",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
fail_under = 90

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "autoflake>=2.3.3",
    "dead>=2.1.0",
    "vulture>=2.16",
]

# 可选的机器学习依赖组 - 需要时单独安装
# uv sync --extra ml
[project.optional-dependencies]
ml = [
    "torch>=2.9.1",                    # PyTorch 深度学习
    "torchaudio>=2.9.1",               # PyTorch 音频处理
    "torchvision>=0.24.1",             # PyTorch 计算机视觉
    "catboost>=1.2.8",                 # CatBoost 梯度提升
    "xgboost>=3.1.2",                  # XGBoost 梯度提升
    "pyqlib>=0.9.7",                   # Qlib 量化框架
    "numba>=0.63.1",                   # JIT 编译器
    "statsmodels>=0.14.6",             # 统计模型
    "joblib>=1.5.2",                   # 并行计算
    "ta-lib>=0.6.8",                   # 技术分析库
]

# 可选的交易所 SDK 依赖组
# uv sync --extra exchanges
exchanges = [
    "binance-sdk-derivatives-trading-usds-futures>=6.2.0",  # Binance 合约
    "binance-sdk-spot>=6.3.0",         # Binance 现货
    "python-binance>=1.0.34",          # Binance Python SDK
    "yfinance>=1.1.0",                 # Yahoo Finance
]

# 可选的回测框架依赖组
# uv sync --extra backtesting
backtesting = [
    "backtrader>=1.9.78.123",          # Backtrader 回测框架
    "nautilus_trader>=1.222.0",        # Nautilus Trader 回测框架
]

# 可选的开发工具依赖组
# uv sync --extra devtools
devtools = [
    "ruff>=0.12.12",                   # Ruff linter/formatter
    "flake8>=7.3.0",                   # Flake8 linter
    "mypy>=1.18.2",                    # Mypy 类型检查
    "pytest-asyncio>=0.23.0",          # pytest 异步支持
    "pytest-timeout>=2.3.0",           # pytest 超时设置
    "pytest-mock>=3.12.0",             # pytest mock
]
