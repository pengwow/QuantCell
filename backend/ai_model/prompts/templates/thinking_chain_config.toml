# 思维链配置文件模板
# 用于定义AI策略生成的思维链步骤

[thinking_chain]
name = "策略生成思维链"
chain_type = "strategy_generation"
description = "基于 axon_quant 框架生成交易策略的标准思维链流程，包含需求分析、策略设计、代码生成、axon_quant API 验证和代码验证五个步骤"

[[thinking_chain.steps]]
title = "需求分析"
description = """
分析用户提供的策略需求，提取关键要素：
1. 识别策略类型（趋势跟踪、均值回归、突破、套利等）
2. 提取交易标的和时间周期
3. 确定入场条件和出场条件
4. 识别风险管理和资金管理要求
5. 确认技术指标和参数需求
6. 确定适用的 axon_quant 组件（指标、订单类型、事件等）

输出：结构化的需求分析报告
"""
order = 1

[[thinking_chain.steps]]
title = "策略设计"
description = """
基于需求分析结果，设计符合 axon_quant 框架的策略架构：
1. 确定策略类结构和继承关系（继承 Strategy 基类）
2. 设计配置类（StrategyConfig + frozen=True）
3. 设计指标计算和数据处理方法（register_indicator_for_bars）
4. 规划信号生成逻辑（on_bar 中的交易逻辑）
5. 设计订单管理策略（order_factory + submit_order / submit_order_list）
6. 设计仓位管理和风险控制模块（portfolio 查询 + close_all_positions）
7. 规划生命周期管理（on_start / on_stop / on_reset / on_save / on_load / on_dispose）
8. 确定参数配置和优化方向

输出：策略设计文档和伪代码
"""
order = 2

[[thinking_chain.steps]]
title = "代码生成"
description = """
根据策略设计文档，生成完整的 axon_quant 策略代码：
1. 实现配置类，继承 StrategyConfig，使用 frozen=True
2. 实现策略类，继承 Strategy 基类
3. 实现 __init__ 方法，初始化参数和指标，使用 PyCondition 验证
4. 实现 on_start 方法，获取 instrument、注册指标、订阅数据
5. 实现 on_bar 方法，检查 indicators_initialized()、处理数据更新、生成信号、执行交易
6. 实现 on_stop 方法，取消订单、关闭持仓、取消订阅、清理资源
7. 实现 on_reset / on_save / on_load / on_dispose 方法
8. 使用 self.instrument.make_qty() 和 self.instrument.make_price() 创建数量和价格
9. 添加必要的注释和文档字符串
10. 确保所有 import 语句完整

输出：完整的、符合 axon_quant 标准的策略代码
"""
order = 3

[[thinking_chain.steps]]
title = "axon_quant API 验证"
description = """
验证生成的代码是否符合 axon_quant 框架规范：
1. 检查配置类是否正确继承 StrategyConfig 并使用 frozen=True
2. 检查策略类是否正确继承 Strategy 基类
3. 检查指标是否通过 register_indicator_for_bars 注册
4. 检查是否使用 indicators_initialized() 检查预热状态
5. 检查是否使用 bar.is_single_price() 检查无效 K 线
6. 检查订单是否通过 order_factory 创建并使用 submit_order / submit_order_list 提交
7. 检查持仓查询是否使用 portfolio 方法（is_flat / is_net_long / is_net_short）
8. 检查日志是否使用 self.log.info() + LogColor
9. 检查数据订阅是否使用 subscribe_bars / request_bars
10. 检查生命周期方法是否完整（on_start / on_bar / on_stop / on_reset / on_save / on_load / on_dispose）
11. 检查是否使用 instrument.make_qty() 和 instrument.make_price()
12. 检查类型注解是否完整

输出：API 合规性验证报告
"""
order = 4

[[thinking_chain.steps]]
title = "代码验证"
description = """
验证生成的代码质量和正确性：
1. 检查 Python 语法是否正确
2. 验证策略类是否正确继承基类
3. 检查必要的抽象方法是否实现
4. 验证参数类型和默认值是否合理
5. 检查是否存在潜在的错误或异常
6. 验证导入语句是否完整且无循环导入
7. 检查代码风格是否符合 PEP 8
8. 验证策略逻辑是否自洽（入场/出场条件不冲突）
9. 检查 instrument 是否为 None 的处理逻辑

输出：验证报告和修复建议（如有问题）
"""
order = 5
